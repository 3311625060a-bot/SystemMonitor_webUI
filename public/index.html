<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>系统监控</title>
<script>
  (function () {
    var saved = null;
    try { saved = localStorage.getItem('theme'); } catch (e) {}
    var dark = saved === 'dark';
    if (saved !== 'dark' && saved !== 'light') {
      dark = !!(window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches);
    }
    document.documentElement.dataset.theme = dark ? 'dark' : 'light';
  })();
</script>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fontsource/harmonyos-sans-sc@5.0.0/index.css" media="print" onload="this.media='all'" />
<link rel="stylesheet" href="style.css" />
<script src="vendor/chart.umd.js"></script>
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <span class="dot pulse" id="brand-dot"></span>
      <h1 data-i18n="title">系统监控</h1>
      <span id="hostname" class="host"></span>
    </div>
    <div class="topbar-right">
      <span id="os-info" class="muted"></span>
      <span id="clock" class="clock num"></span>
      <select id="poll-interval" class="poll-select" aria-label="页面刷新频率" title="页面刷新频率">
        <option value="1" data-i18n="poll1s">1 秒</option>
        <option value="2" data-i18n="poll2s">2 秒</option>
        <option value="5" data-i18n="poll5s">5 秒</option>
        <option value="10" data-i18n="poll10s">10 秒</option>
      </select>
      <button type="button" class="lang-toggle" id="lang-toggle" title="Switch to English" aria-label="Switch to English">EN</button>
      <button type="button" class="theme-toggle" id="theme-toggle" title="切换到暗黑模式" aria-label="切换到暗黑模式" aria-pressed="false">
        <svg class="icon-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true">
          <circle cx="12" cy="12" r="4.2"></circle>
          <path d="M12 2.5v2.2M12 19.3v2.2M2.5 12h2.2M19.3 12h2.2M5.3 5.3l1.6 1.6M17.1 17.1l1.6 1.6M18.7 5.3l-1.6 1.6M6.9 17.1l-1.6 1.6"></path>
        </svg>
        <svg class="icon-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M20.2 14.6A8.4 8.4 0 1 1 9.4 3.8a6.8 6.8 0 0 0 10.8 10.8Z"></path>
        </svg>
      </button>
    </div>
  </header>

  <div id="auth-gate" class="auth-gate" hidden>
    <div class="auth-card" role="dialog" aria-modal="true" aria-labelledby="auth-title">
      <div class="auth-mark" aria-hidden="true">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
          <rect x="4.5" y="10" width="15" height="10.5" rx="2.6"></rect>
          <path d="M8.2 10V7.8a3.8 3.8 0 0 1 7.6 0V10"></path>
          <circle cx="12" cy="15.2" r="1.15" fill="currentColor" stroke="none"></circle>
        </svg>
      </div>
      <h2 id="auth-title" class="auth-title"></h2>
      <p id="auth-subtitle" class="auth-subtitle"></p>
      <form id="auth-form" novalidate>
        <div class="auth-field">
          <label for="auth-password" data-i18n="password">密码</label>
          <div class="auth-input">
            <input id="auth-password" type="password" autocomplete="current-password" spellcheck="false" required />
            <button type="button" class="auth-eye" id="auth-eye" aria-pressed="false" aria-label="显示密码" title="显示密码">
              <svg class="eye-open" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <path d="M2.2 12S5.8 6 12 6s9.8 6 9.8 6-3.6 6-9.8 6-9.8-6-9.8-6Z"></path>
                <circle cx="12" cy="12" r="2.9"></circle>
              </svg>
              <svg class="eye-off" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <path d="M2.2 12S5.8 6 12 6s9.8 6 9.8 6-3.6 6-9.8 6-9.8-6-9.8-6Z"></path>
                <circle cx="12" cy="12" r="2.9"></circle>
                <path d="M3.5 3.5l17 17"></path>
              </svg>
            </button>
          </div>
        </div>
        <div class="auth-field" id="auth-confirm-field" hidden>
          <label for="auth-confirm" data-i18n="confirmPassword">确认密码</label>
          <input id="auth-confirm" type="password" autocomplete="new-password" spellcheck="false" />
        </div>
        <p class="auth-hint" id="auth-hint" data-i18n="passwordHint">至少 8 个字符</p>
        <label class="auth-remember" id="auth-remember-row">
          <input type="checkbox" id="auth-remember" />
          <span data-i18n="remember">自动登录</span>
        </label>
        <p class="auth-error" id="auth-error" role="alert" aria-live="polite" hidden></p>
        <button type="submit" class="auth-submit" id="auth-submit"></button>
      </form>
      <p class="auth-note" id="auth-note"></p>
    </div>
  </div>

  <main class="grid">
    <section class="card sysinfo">
      <h2 data-i18n="sysConfig">系统配置</h2>
      <div class="sys-grid">
        <div class="sys-item">
          <div class="sys-label" data-i18n="cpuName">处理器</div>
          <div id="sys-cpu" class="sys-value"></div>
          <div id="sys-cpu-sub" class="sys-sub"></div>
        </div>
        <div class="sys-item">
          <div class="sys-label" data-i18n="memory">内存</div>
          <div id="sys-mem" class="sys-value"></div>
        </div>
        <div class="sys-item">
          <div class="sys-label" data-i18n="gpuName">显卡</div>
          <div id="sys-gpu" class="sys-value"></div>
          <div id="sys-gpu-sub" class="sys-sub"></div>
        </div>
        <div class="sys-item">
          <div class="sys-label" data-i18n="osName">操作系统</div>
          <div id="sys-os" class="sys-value"></div>
          <div id="sys-os-sub" class="sys-sub"></div>
        </div>
        <div class="sys-item">
          <div class="sys-label" data-i18n="boardName">主板</div>
          <div id="sys-board" class="sys-value"></div>
        </div>
      </div>
    </section>

    <section class="card gauges">
      <h2 data-i18n="resources">资源使用</h2>
      <div class="gauge-grid">
        <div class="gauge" data-color="var(--accent)">
          <svg viewBox="0 0 120 120">
            <circle class="track" cx="60" cy="60" r="52"></circle>
            <circle class="value" cx="60" cy="60" r="52" data-gauge="cpu"></circle>
          </svg>
          <div class="gauge-text">
            <div class="gauge-num" id="cpu-num">0%</div>
            <div class="gauge-label" data-i18n="cpu">CPU</div>
            <div class="gauge-sub" id="cpu-temp" hidden></div>
          </div>
        </div>
        <div class="gauge" data-color="var(--accent-2)">
          <svg viewBox="0 0 120 120">
            <circle class="track" cx="60" cy="60" r="52"></circle>
            <circle class="value" cx="60" cy="60" r="52" data-gauge="mem"></circle>
          </svg>
          <div class="gauge-text">
            <div class="gauge-num" id="mem-num">0%</div>
            <div class="gauge-label" data-i18n="memory">内存</div>
            <div class="gauge-sub" id="mem-sub">--</div>
          </div>
        </div>
      </div>
    </section>

    <section class="card chart-card">
      <h2><span data-i18n="history">使用历史</span>
        <div class="seg" id="range-toggle">
          <button type="button" data-range="60" data-i18n="range60">60 秒</button>
          <button type="button" data-range="300" data-i18n="range5m">5 分钟</button>
          <button type="button" data-range="900" data-i18n="range15m">15 分钟</button>
          <button type="button" data-range="3600" data-i18n="range1h">1 小时</button>
        </div>
      </h2>
      <div class="chart-wrap">
        <canvas id="history-chart"></canvas>
      </div>
    </section>

    <section class="card gpu-list">
      <h2><span data-i18n="gpuDetails">显卡详情</span>
        <div class="seg" id="gpu-toggle" hidden></div>
      </h2>
      <div id="gpu-list-container"></div>
    </section>

    <section class="card power-card">
      <h2 data-i18n="power">电源</h2>
      <div id="power-content" class="power-content">
        <div class="muted" data-i18n="detecting">检测中...</div>
      </div>
    </section>

    <section class="card io-card">
      <h2 data-i18n="io">I/O 吞吐量</h2>
      <div class="io-grid">
        <div class="io-item">
          <div class="io-label" data-i18n="netDown">网络下载</div>
          <div class="io-value" id="net-down">0</div>
          <div class="io-unit">MB/s</div>
        </div>
        <div class="io-item">
          <div class="io-label" data-i18n="netUp">网络上传</div>
          <div class="io-value" id="net-up">0</div>
          <div class="io-unit">MB/s</div>
        </div>
        <div class="io-item">
          <div class="io-label" data-i18n="diskRead">磁盘读取</div>
          <div class="io-value" id="disk-reads">0</div>
          <div class="io-unit">MB/s</div>
        </div>
        <div class="io-item">
          <div class="io-label" data-i18n="diskWrite">磁盘写入</div>
          <div class="io-value" id="disk-writes">0</div>
          <div class="io-unit">MB/s</div>
        </div>
      </div>
    </section>
  </main>

  <div id="conn-banner" class="conn-banner" hidden role="status" aria-live="polite">
    <span class="conn-dot" aria-hidden="true"></span>
    <span class="conn-text" data-i18n="connLost">连接已断开</span>
    <button type="button" class="conn-retry" id="conn-retry" data-i18n="retry">重试</button>
  </div>

  <footer class="footer">
    <span id="status" class="muted small" data-i18n="connecting">连接中...</span>
    <div class="credit">
      © 2026 金将军的迈巴赫保养员 ·
      <a href="https://github.com/3311625060a-bot/SystemMonitor_webUI/blob/main/LICENSE" target="_blank" rel="noopener noreferrer">MIT License</a> ·
      <a class="credit-gh" href="https://github.com/3311625060a-bot" target="_blank" rel="noopener noreferrer">
        <svg viewBox="0 0 16 16" fill="currentColor" aria-hidden="true"><path d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.79-.2-3.67-.9-3.67-4.02 0-.89.32-1.62.84-2.2-.09-.21-.37-1.04.08-2.17 0 0 .68-.22 2.23.83a7.8 7.8 0 0 1 2.01-.27c.68 0 1.36.09 2.01.27 1.55-1.05 2.23-.83 2.23-.83.45 1.13.17 1.96.08 2.17.52.57.84 1.3.84 2.2 0 3.13-1.89 3.82-3.69 4.02.29.25.55.74.55 1.49 0 1.08-.01 1.95-.01 2.22 0 .21.15.46.55.38A7.99 7.99 0 0 0 16 8c0-4.42-3.58-8-8-8Z"/></svg>
        GitHub
      </a>
    </div>
  </footer>

  <script src="app.js"></script>
</body>
</html>
